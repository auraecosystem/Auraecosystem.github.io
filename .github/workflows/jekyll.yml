# Build and validate the Jekyll version without deploying it.
# Production GitHub Pages deployment is handled by static.yml.
name: Validate Jekyll build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install Jekyll
        run: gem install jekyll --version "~> 4.3" --no-document

      - name: Build Jekyll site
        run: jekyll build --source . --destination _site --safe
        env:
          JEKYLL_ENV: production
